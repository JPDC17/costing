# Builds and publishes Job Costing on GitHub's Windows machines.
#
# On every push: run the tests and a real-Windows test of the in-app update swap.
# If package.json has a version that hasn't been released yet (e.g. you raised it from
# 1.2.0 to 1.3.0), also build the portable exe and publish it as a GitHub Release, tagged
# v<version>, with latest.json (which the app's update button reads). The release notes,
# also shown in the app's update prompt, come from RELEASE_NOTES.md.
name: Release

on:
  push:
    branches: [claude/tender-tesla-clm33c, main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and its tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Update swap test (real Windows PowerShell)
        run: node scripts/test-swap-windows.js

      - name: Is this version new?
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new; it will be built and published."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the portable exe
        if: steps.version.outputs.publish == 'true'
        run: npx electron-builder --win portable --x64 --publish never

      - name: Write latest.json
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: node scripts/write-manifest.js "$(cat RELEASE_NOTES.md 2>/dev/null)"

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/JobCosting-Portable.exe latest.json \
            --target "$GITHUB_SHA" --title "Job Costing ${{ steps.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md --latest
